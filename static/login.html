<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#f8f6f2" />
  <title>Acceso privado · AURA Etiquetas</title>
  <style>
  :root {color-scheme:light; font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#302b27;background:#f8f6f2}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#eee5d8,transparent 48%),#f8f6f2}
  main{width:min(100%,440px);background:white;border:1px solid #e6dfd7;border-radius:20px;padding:clamp(28px,5vw,46px);box-shadow:0 16px 60px #4f32170d}
  .brand{font-size:14px;letter-spacing:4px;font-weight:800}.brand span{color:#a47e57;font-size:12px;letter-spacing:2px}.symbol{font-size:30px;color:#c7a47d;margin-bottom:22px}
  h1{font-family:Georgia,serif;font-size:32px;font-weight:400;line-height:1.2;margin:22px 0 10px}p{line-height:1.65;color:#766e66;font-size:14px;margin:0 0 28px}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}input{width:100%;padding:14px 15px;border:1px solid #cfc7bc;border-radius:10px;font:inherit;font-size:16px;outline-color:#8d7354}
  button{width:100%;padding:15px 18px;border:0;border-radius:10px;background:#2d2925;color:white;margin-top:20px;font-weight:700;font-size:14px;cursor:pointer}button:hover{background:#4b4035}
  .error{background:#fff1ef;color:#972b24;padding:12px 13px;border-radius:10px;font-size:13px;margin-bottom:18px}
  footer{text-align:center;font-size:11px;color:#958a7d;margin-top:23px;letter-spacing:1.5px}
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">✧</div>
    <div class="brand">AURA <span>/ STUDIO</span></div>
    <h1>Tu taller, solo para ti.</h1>
    <p>Introduce tu contraseña para acceder a tus etiquetas y pliegos de impresión.</p>
    <div class="error" id="login-error" %%LOGIN_HIDDEN%%>%%LOGIN_ERROR%%</div>
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf" value="%%LOGIN_CSRF%%" />
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required minlength="1" autofocus />
      <button type="submit">Entrar al taller →</button>
    </form>
    <footer>ACCESO PRIVADO · AURA ETIQUETAS</footer>
  </main>
</body>
</html>
